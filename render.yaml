services:
  - type: web
    name: wisdomly-api-qa
    env: node
    branch: develop
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @wisdomly/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        sync: false

  - type: web
    name: wisdomly-api-prod
    env: node
    branch: main
    region: singapore
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @wisdomly/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false